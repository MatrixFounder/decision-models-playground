    instructions: 'Есть ли в звонке: Оператор договаривается о следующем контакте?'
    criteria:
      'true': 'Оператор договаривается о следующем звонке или встрече: «давайте созвонимся»,
        «я вам перезвоню», «когда вам удобно?», «в какое время удобно?», «наберу вас
        завтра», «договорились на четверг», «свяжусь с вами». Проверяется в речи оператора
        (область «участник»); в анкете — «договорился о следующем шаге» в конце звонка.
        Клиент говорит те же слова, когда откладывает решение («я сам перезвоню» —
        «Клиент подумает») или просит перезвонить («Клиент не может разговаривать»),
        а одиночное «созвонимся» в конце — ещё и «Неформальное прощание».'
