    instructions: 'Есть ли в звонке: Отказы клиента без причины?'
    criteria:
      'true': 'Короткий отказ клиента: «нет, спасибо», «нет, не надо», «нам это не
        нужно», «нам не подходит», «ничего не нужно», «не интересует», «не актуально»,
        «откажусь», «брать не будем». Проверяется в речи клиента (область «участник»)
        и входит в составной словарь «Отказы клиента», но не в «Возражения клиента»;
        словарь не видит, назвал ли клиент причину. В анкете «отказ без причины» —
        это этот тег при отсутствии тегов-причин («Клиенту дорого», «Клиенту невыгодно»,
        «У клиента нет времени», «Клиент использует конкурентов»); «Клиенту неинтересно»
        в этот список не входит, потому что «не интересует» словарь сам считает отказом
        без причины.'
