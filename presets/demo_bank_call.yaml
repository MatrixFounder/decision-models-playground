# Пример: звонок банка (noul, choice, score). Synthetic call, no real data.
title: 'Пример: звонок банка (noul, choice, score)'
source: tests/fixtures/requests/core_ru.json
state: |-
  Оператор: Добрый день! Меня зовут Анна, банк «Северный». Удобно говорить?
  Клиент: Да, слушаю.
  Оператор: У нас новый вклад «Надёжный», ставка 14 % годовых на полгода. Вам было бы интересно?
  Клиент: Вообще да, я как раз думал, куда положить деньги. Но сейчас за рулём, неудобно.
  Оператор: Конечно. Когда вам перезвонить?
  Клиент: Давайте в четверг после шести вечера.
  Оператор: Хорошо, перезвоню в четверг после 18:00. Всего доброго!
  Клиент: До свидания.
questions:
  callback_agreed:
    type: noul
    instructions: Договорился ли клиент о повторном звонке?
    criteria:
      'true': Клиент согласился, чтобы ему перезвонили, или сам назвал время звонка.
      'false': Клиент отказался от повторного звонка, или о нём не говорили.
  call_topic:
    type: choice
    instructions: Какова основная тема звонка?
    criteria:
      credit: Кредит или кредитная карта
      deposit: Вклад или накопительный счёт
      complaint: Жалоба клиента на обслуживание
  interest:
    type: score
    instructions: Насколько клиент заинтересован в предложении?
    criteria:
    - Не заинтересован
    - Слегка заинтересован
    - Заинтересован
    - Готов оформить сейчас
